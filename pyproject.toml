[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_framework"
version = "0.1.0"
authors = [
  { name="ITK Development", email="itk-rpa@mkb.aarhus.dk" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
# HVER VERSION ER LAAST, OG DET ER EN SIKKERHEDSREGEL - IKKE PEDANTERI.
# Robotten installerer sine afhaengigheder ved HVER koersel. Med ">=" henter den
# den nyeste udgave paa PyPI i samme oejeblik, den koerer - saa en kapret eller
# kompromitteret pakke rammer robotmaskinen uden at nogen har besluttet noget.
# Et "==" betyder, at en ny version er en beslutning, nogen traeffer.
#
# cryptography staar IKKE her: den kommer med OpenOrchestrator, som pinner den
# selv (==45.0.*). To steder at bestemme den version er ét for mange.
#
# oomtm peger paa en COMMIT og ikke paa "main". Vi vedligeholder selv oomtm, men
# en gren flytter sig - og saa er det ikke laengere laast. En commit er.
dependencies = [
    "OpenOrchestrator == 3.*",
    # oomtm b386b55: PDF'er laves med oomtm.convert (WeasyPrint til mails,
    # HTML, tekst og CSV; LibreOffice til Office). [pdf] giver motorernes
    # pakker; motorerne selv installeres uden admin ved første kørsel.
    "oomtm[pdf] @ git+https://github.com/mtm-aarhus/oomtm.git@b386b557439ae47228325f647d96750e41a6ffd8",
    "requests == 2.34.2",
    "Pillow == 10.4.0",
]
# F2's egen konvertering (rel/pdf-content) bruges ikke laengere: alle KontAKTs
# PDF'er laves af oomtm.convert, saa samme fil giver samme PDF, uanset kilden.
# Derfor "oomtm[pdf]". Motorerne installeres uden admin ved foerste koersel,
# én gang pr. maskine (LibreOffice ~350 MB, WeasyPrints biblioteker ~30 MB).
#
# Pillow bliver: robot_framework/error_screenshot.py importerer PIL, saa den er
# en kerneafhaengighed for HVER robot og maa aldrig fjernes.

[project.optional-dependencies]
dev = [
  "pylint",
  "flake8"
]
